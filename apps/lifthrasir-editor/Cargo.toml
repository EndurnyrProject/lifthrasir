[package]
name = "lifthrasir-editor"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true }
bevy_framepace = { workspace = true }
bevy_egui = { workspace = true }
transform-gizmo = "0.11"
bevy_kira_audio = { workspace = true }
lifthrasir-assets = { path = "../../crates/lifthrasir-assets" }
lifthrasir-runtime = { path = "../../crates/lifthrasir-runtime" }
lifthrasir-data = { path = "../../crates/lifthrasir-data" }
lifthrasir-tooling = { path = "../../crates/lifthrasir-tooling" }
ro-formats = { path = "../../crates/ro-formats" }
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"

[dev-dependencies]
tempfile = { workspace = true }
# Encodes the fixture water texture; the same crate Bevy decodes it with.
image = { workspace = true, features = ["jpeg"] }
