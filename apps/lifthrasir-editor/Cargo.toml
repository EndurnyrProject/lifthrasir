[package]
name = "lifthrasir-editor"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true }
bevy_egui = "0.42"
# No `mouse_interaction`: the editor starts drags itself, only over the viewport.
transform-gizmo-bevy = { version = "0.11", default-features = false, features = ["gizmo_picking_backend"] }
bevy_kira_audio = "0.26"
lifthrasir-assets = { path = "../../crates/lifthrasir-assets" }
lifthrasir-runtime = { path = "../../crates/lifthrasir-runtime" }
lifthrasir-data = { path = "../../crates/lifthrasir-data" }
lifthrasir-tooling = { path = "../../crates/lifthrasir-tooling" }
ro-formats = { path = "../../crates/ro-formats" }
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
