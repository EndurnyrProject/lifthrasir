version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Every PR touches Cargo.lock, so each merge would make Dependabot rebase
    # (and re-run CI on) every other open PR. Rebase on demand instead with
    # `@dependabot rebase`; master CI validates the merged result.
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bevy and its ecosystem crates move in lockstep; bump them together.
      bevy:
        patterns:
          - "bevy"
          - "bevy_*"
          - "bevy-*"
          - "iyes_*"
          - "leafwing-*"
          - "moonshine-*"
        update-types:
          - major
          - minor
          - patch
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
