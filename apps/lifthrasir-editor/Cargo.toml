[package]
name = "lifthrasir-editor"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true }
bevy_framepace = { workspace = true }
bevy_egui = { workspace = true }
transform-gizmo = "0.11"
bevy_kira_audio = { workspace = true }
lifthrasir-assets = { path = "../../crates/lifthrasir-assets" }
lifthrasir-runtime = { path = "../../crates/lifthrasir-runtime" }
lifthrasir-data = { path = "../../crates/lifthrasir-data" }
lifthrasir-tooling = { path = "../../crates/lifthrasir-tooling" }
ro-formats = { path = "../../crates/ro-formats" }
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "7"
# MCP: the channel between the server thread and the Bevy world.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "net", "macros"] }
schemars = "1"
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
base64 = "0.22"
# Encodes MCP captures as PNG; tests also decode a JPEG fixture with it.
image = { workspace = true, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = { workspace = true }
