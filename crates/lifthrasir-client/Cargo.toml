[package]
name = "lifthrasir-client"
version.workspace = true
edition.workspace = true

[dependencies]
ro-formats = { path = "../ro-formats" }
lifthrasir-assets = { path = "../lifthrasir-assets" }
lifthrasir-runtime = { path = "../lifthrasir-runtime" }
lifthrasir-data = { path = "../lifthrasir-data" }
net-contract = { path = "../net-contract" }
bevy = { workspace = true, features = [
    "bevy_gltf",
    "png",
    "ktx2",
    "zstd_rust",
] }
bevy_auto_plugin = { workspace = true }
bevy_common_assets = { workspace = true, features = ["toml", "ron"] }
iyes_progress = { workspace = true }
bevy_kira_audio = { workspace = true }
bevy_framepace = { workspace = true }
dirs = "6"
leafwing-input-manager = { workspace = true }

# Parsing and data processing
thiserror = { workspace = true }
image = { workspace = true }
serde = { workspace = true }

# Security dependencies
secrecy = { workspace = true }

# Character entity system dependencies
moonshine-kind = { workspace = true }
moonshine-tag = { workspace = true }
moonshine-behavior = { workspace = true }

ron = { workspace = true }

[features]
default = []
dynamic = ["bevy/dynamic_linking"]
dlss = ["bevy/dlss"]

[dev-dependencies]
bevy = { workspace = true, features = ["debug"] }
regex = { workspace = true }
lifthrasir-ui = { path = "../lifthrasir-ui" }
gltf = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
lifthrasir-runtime = { path = "../lifthrasir-runtime", features = ["test-support"] }
tempfile = { workspace = true }
