[package]
name = "game-engine"
version.workspace = true
edition.workspace = true

[dependencies]
ro-formats = { path = "../ro-formats" }
lifthrasir-data = { path = "../lifthrasir-data" }
net-contract = { path = "../net-contract" }
bevy = { workspace = true }
bevy_auto_plugin = { workspace = true }
bevy_common_assets = { version = "0.17", features = ["toml", "ron"] }
iyes_progress = { workspace = true }
bevy_kira_audio = { version = "0.26", features = ["mp3", "wav", "ogg"] }
bevy_framepace = { workspace = true }
# default-features off drops the `2d` render path: this project has no 2D
# particles, and the 2D path double-draws every world effect through the UI
# Camera2d as fixed screen-space specks. Keep only `3d`.
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }
dirs = "6"
leafwing-input-manager = { workspace = true }

# Parsing and data processing
thiserror = { workspace = true }
image = "0.25.8"
xbrz-rs = "0.1"
resvg = "0.47"
futures-lite = "2.6.1"
encoding_rs = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }

# Security dependencies
secrecy = { workspace = true }

# Character entity system dependencies
moonshine-kind = "0.5"
moonshine-tag = "0.5"
moonshine-behavior = "0.5"

# Pathfinding
pathfinding = "4.15"
ron = { workspace = true }

# map-gltf: naming the extension-handler hook types and parsing LIF_* payloads.
# Pinned to the same gltf release bevy_gltf uses so cargo unifies them.
gltf = { version = "1.4", optional = true, default-features = false, features = [
    "extensions",
    "extras",
    "names",
] }
serde_json = { version = "1.0", optional = true }

[features]
default = []
dynamic = ["bevy/dynamic_linking"]
dlss = ["bevy/dlss"]
map-gltf = ["bevy/bevy_gltf", "bevy/png", "dep:gltf", "dep:serde_json"]

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["xbrz-rs"]
