[package]
name = "lifthrasir-map-editor"
version.workspace = true
edition.workspace = true

[features]
default = ["gui"]
gui = ["dep:bevy", "dep:dear-imgui-bevy", "dep:dear-imgui-rs", "dep:clap", "dep:lifthrasir-assets", "dep:lifthrasir-runtime", "dep:rfd", "dep:toml"]

[[bin]]
name = "lifthrasir-map-editor"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = { workspace = true }
bevy = { workspace = true, optional = true, features = ["bevy_dev_tools", "bevy_gltf", "free_camera", "ktx2", "zstd_rust"] }
dear-imgui-bevy = { version = "0.19", default-features = false, features = ["render"], optional = true }
dear-imgui-rs = { version = "0.19", optional = true }
clap = { workspace = true, optional = true }
lifthrasir-data = { path = "../lifthrasir-data" }
lifthrasir-assets = { path = "../lifthrasir-assets", optional = true }
lifthrasir-runtime = { path = "../lifthrasir-runtime", optional = true }
rfd = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true, optional = true }
