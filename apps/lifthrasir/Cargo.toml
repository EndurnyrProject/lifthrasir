[package]
name = "lifthrasir"
version.workspace = true
edition.workspace = true

[features]
default = ["net-aesir"]
# Aesir QUIC network adapter. On by default; disable to build the client
# without the aesir protocol wired in (e.g. to swap in a different adapter).
net-aesir = ["dep:net-aesir"]
# Live-inspection tooling (BRP, diagnostics overlay). Opt-in via
# `--features dev`; normal builds (and distribution) stay clean of it.
dev = [
    "bevy/bevy_remote",
    "bevy/bevy_dev_tools",
    "dep:bevy_brp_extras",
    "lifthrasir-client-ui/dev",
]
# Tracy profiling. Deliberately split from `dev`: tracy-client is not built
# in on-demand mode, so it buffers every profiling zone in memory from
# startup until a Tracy profiler attaches and drains it -- running with this
# feature and no profiler attached grows memory without bound. Enable only
# while actually profiling: `--features dev,tracy`.
tracy = ["bevy/trace", "bevy/trace_tracy"]
dlss = ["bevy/dlss", "lifthrasir-client/dlss", "lifthrasir-client-ui/dlss"]

[dependencies]
bevy = { workspace = true }
bevy_framepace = { workspace = true }
bevy_brp_extras = { workspace = true, optional = true }
lifthrasir-client = { path = "../../crates/lifthrasir-client" }
net-contract = { path = "../../crates/net-contract" }
lifthrasir-assets = { path = "../../crates/lifthrasir-assets" }
lifthrasir-runtime = { path = "../../crates/lifthrasir-runtime" }
lifthrasir-client-ui = { path = "../../crates/lifthrasir-client-ui" }
lifthrasir-ui = { path = "../../crates/lifthrasir-ui" }
net-aesir = { path = "../../crates/net-aesir", optional = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
