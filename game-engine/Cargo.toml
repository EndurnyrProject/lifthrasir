[package]
name = "game-engine"
version.workspace = true
edition.workspace = true

[dependencies]
ro-formats = { path = "../ro-formats" }
lifthrasir-assets = { path = "../lifthrasir-assets" }
lifthrasir-runtime = { path = "../lifthrasir-runtime" }
lifthrasir-data = { path = "../lifthrasir-data" }
net-contract = { path = "../net-contract" }
bevy = { workspace = true, features = [
    "bevy_gltf",
    "png",
    "ktx2",
    "zstd_rust",
] }
bevy_auto_plugin = { workspace = true }
bevy_common_assets = { version = "0.17", features = ["toml", "ron"] }
iyes_progress = { workspace = true }
bevy_kira_audio = { version = "0.26", features = ["mp3", "wav", "ogg"] }
bevy_framepace = { workspace = true }
dirs = "6"
leafwing-input-manager = { workspace = true }

# Parsing and data processing
thiserror = { workspace = true }
image = { workspace = true }
futures-lite = "2.6.1"
encoding_rs = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }

# Security dependencies
secrecy = { workspace = true }

# Character entity system dependencies
moonshine-kind = "0.5"
moonshine-tag = "0.5"
moonshine-behavior = "0.5"

ron = { workspace = true }

# Naming the extension-handler hook types and parsing LIF_* payloads.
# Pinned to the same gltf release bevy_gltf uses so cargo unifies them.
gltf = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
dynamic = ["bevy/dynamic_linking"]
dlss = ["bevy/dlss"]

[dev-dependencies]
lifthrasir-runtime = { path = "../lifthrasir-runtime", features = ["test-support"] }
tempfile = { workspace = true }
