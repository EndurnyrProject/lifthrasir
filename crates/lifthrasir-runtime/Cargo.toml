[package]
name = "lifthrasir-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_gltf", "png", "ktx2", "zstd_rust"] }
bevy_auto_plugin = { workspace = true }
bevy_kira_audio = { workspace = true }
ro-formats = { path = "../ro-formats" }
lifthrasir-assets = { path = "../lifthrasir-assets" }
lifthrasir-data = { path = "../lifthrasir-data" }
moonshine-tag = { workspace = true }
moonshine-kind = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gltf = { workspace = true, features = ["KHR_lights_punctual"] }
pathfinding = "4.16"
bevy_hanabi = { workspace = true }

[features]
test-support = []

[dev-dependencies]
toml = { workspace = true }
